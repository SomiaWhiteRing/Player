name: Build and Release

on:
  push:
    branches:
      - my-feature-stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  TRACKED_BRANCH: my-feature-stable
  WINDOWS_ASSET_NAME: Player.exe
  WEB_ASSET_NAME: EasyRPG-Player-Kai-nightly-web.zip
  ANDROID_ASSET_NAME: EasyRPG-Player-Kai-nightly-android-debug.apk

jobs:
  windows:
    if: github.ref == 'refs/heads/my-feature-stable'
    name: Build Windows
    runs-on: windows-2022
    env:
      BUILD_DIR: build/windows-x64-vs2022-release
      BUILDSCRIPTS_DIR: ${{ github.workspace }}\external\buildscripts
      VCPKG_TRIPLET: x64-windows-static
      TOOLCHAIN_URL: https://ci.easyrpg.org/downloads/windows/toolchain-windows.zip

    steps:
      - name: Clone pinned commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release metadata
        run: python builds/ci/release.py validate

      - name: Restore EasyRPG Windows toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILDSCRIPTS_DIR }}\windows\vcpkg
          key: easyrpg-windows-toolchain-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-2026-04-28

      - name: Restore Windows build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: easyrpg-windows-build-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ github.sha }}
          restore-keys: |
            easyrpg-windows-build-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      - name: Restore source timestamps for Windows incremental build
        run: |
          $marker = Join-Path $env:BUILD_DIR ".player-cache-commit"
          $changedSince = if (Test-Path $marker) { Get-Content $marker -Raw } else { "" }
          .\builds\ci\restore-git-mtime.ps1 -ChangedSince $changedSince.Trim()

      - name: Package Windows nightly artifact
        id: package
        run: |
          .\builds\ci\package-windows-nightly.ps1
          New-Item -ItemType Directory -Force -Path $env:BUILD_DIR | Out-Null
          git rev-parse HEAD | Set-Content -NoNewline (Join-Path $env:BUILD_DIR ".player-cache-commit")

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: build/artifacts/${{ env.WINDOWS_ASSET_NAME }}
          if-no-files-found: error

  web:
    if: github.ref == 'refs/heads/my-feature-stable'
    name: Build Web
    runs-on: ubuntu-24.04

    steps:
      - name: Clone pinned commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release metadata
        run: python builds/ci/release.py validate

      - name: Restore local Docker Web cache
        uses: actions/cache@v4
        with:
          path: |
            external/local-docker/web
            external/local-docker/home
          key: easyrpg-local-docker-web-${{ runner.os }}-${{ hashFiles('builds/docker/package.Dockerfile', 'builds/ci/package-ubuntu-nightly.cache.env') }}
          restore-keys: |
            easyrpg-local-docker-web-${{ runner.os }}-

      - name: Package Web nightly artifact
        run: |
          ./builds/package-docker.ps1 web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-web
          path: build/artifacts/${{ env.WEB_ASSET_NAME }}
          if-no-files-found: error

  android:
    if: github.ref == 'refs/heads/my-feature-stable'
    name: Build Android
    runs-on: ubuntu-24.04

    steps:
      - name: Clone pinned commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release metadata
        run: python builds/ci/release.py validate

      - name: Restore local Docker Android cache
        uses: actions/cache@v4
        with:
          path: |
            external/local-docker/android
            external/local-docker/gradle
            external/local-docker/home
          key: easyrpg-local-docker-android-${{ runner.os }}-${{ hashFiles('builds/docker/package.Dockerfile', 'builds/ci/package-ubuntu-nightly.cache.env') }}
          restore-keys: |
            easyrpg-local-docker-android-${{ runner.os }}-

      - name: Package Android nightly artifact
        run: |
          ./builds/package-docker.ps1 android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-android
          path: build/artifacts/${{ env.ANDROID_ASSET_NAME }}
          if-no-files-found: error

  publish:
    name: Publish Nightly and new versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [windows, web, android]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python builds/ci/release.py publish \
            --branch "$TRACKED_BRANCH" --project 'EasyRPG Player Kai' \
            --assets "$RUNNER_TEMP/release-assets/$WINDOWS_ASSET_NAME" \
              "$RUNNER_TEMP/release-assets/$WEB_ASSET_NAME" \
              "$RUNNER_TEMP/release-assets/$ANDROID_ASSET_NAME"
